decisions:
- id: decision:adr-003
  number: ADR-003
  title: Run Ledger on Postgres Main
  date: 1736121600000
  status_timeline:
  - status: accepted
    at: 1736121600000
  - status: superseded
    at: 1770681600000
  deciders:
  - person:marta-kowalczyk
  - team:platform
  affects:
  - system:ledger
  replaces: []
  rationale_points:
  - Postgres Main is the shared relational store that Infra already operates with tested backups.
  - Ledger needs strict transactional guarantees for every double-entry posting.
- id: decision:adr-007
  number: ADR-007
  title: Move Ledger to Aurora
  date: 1768867200000
  status_timeline:
  - status: proposed
    at: 1768867200000
  - status: accepted
    at: 1770681600000
  deciders:
  - person:priya-raman
  - person:bob-lindqvist
  - team:payments
  affects:
  - system:ledger
  replaces:
  - decision:adr-003
  rationale_points:
  - Postgres Main could not sustain Ledger write volume during month-end close.
  - Aurora gives Ledger storage autoscaling and replica failover in under a minute.
  - Moving Ledger off Postgres Main frees the shared cluster for Reporting workloads.
- id: decision:adr-014
  number: ADR-014
  title: Use OpenTelemetry for Session Store
  date: 1740009600000
  status_timeline:
  - status: accepted
    at: 1740009600000
  - status: superseded
    at: 1756166400000
  deciders:
  - person:elif-takahashi
  - person:teodor-arnesen
  - team:insights
  affects:
  - system:session-store
  replaces: []
  rationale_points:
  - Session Store needs predictable latency as traffic grows through the year.
  - Moving to OpenTelemetry lets Session Store scale without hand-tuned capacity.
