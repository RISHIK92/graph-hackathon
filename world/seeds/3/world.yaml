  - Incidents on Billing-v2 last quarter traced back to the existing approach.
- id: decision:adr-019
  number: ADR-019
  title: Adopt Kubernetes for Partner API
  date: 1749859200000
  status_timeline:
  - status: proposed
    at: 1749859200000
  - status: rejected
    at: 1751500800000
  deciders:
  - person:arjun-moreau
  - person:jada-carrow
  - team:growth
  affects:
  - project:partner-api
  replaces: []
  rationale_points:
  - Kubernetes is already operated by other teams, so support costs stay low.
  - The current setup for Partner API makes on-call debugging slow and manual.
