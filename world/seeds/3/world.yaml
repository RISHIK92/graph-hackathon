decisions:
- id: decision:adr-003
  number: ADR-003
  title: Run Ledger on Postgres Main
  date: 1736121600000
  status_timeline:
  - status: accepted
    at: 1736121600000
  - status: superseded
    at: 1770681600000
  deciders:
  - person:marta-kowalczyk
  - team:platform
  affects:
  - system:ledger
  replaces: []
  rationale_points:
  - Postgres Main is the shared relational store that Infra already operates with tested backups.
  - Ledger needs strict transactional guarantees for every double-entry posting.
- id: decision:adr-007
  number: ADR-007
  title: Move Ledger to Aurora
  date: 1768867200000
  status_timeline:
  - status: proposed
    at: 1768867200000
  - status: accepted
    at: 1770681600000
  deciders:
  - person:priya-raman
  - person:bob-lindqvist
  - team:payments
  affects:
  - system:ledger
  replaces:
  - decision:adr-003
  rationale_points:
  - Postgres Main could not sustain Ledger write volume during month-end close.
  - Aurora gives Ledger storage autoscaling and replica failover in under a minute.
  - Moving Ledger off Postgres Main frees the shared cluster for Reporting workloads.
- id: decision:adr-001
  number: ADR-001
  title: Use DynamoDB for Session Store
  date: 1738540800000
  status_timeline:
  - status: accepted
    at: 1738540800000
  - status: superseded
    at: 1753833600000
  deciders:
  - person:anders-yilmaz
  - person:mads-haddad
  - team:risk
  affects:
  - system:session-store
  replaces: []
  rationale_points:
  - Incidents on Session Store last quarter traced back to the existing approach.
  - Moving to DynamoDB lets Session Store scale without hand-tuned capacity.
- id: decision:adr-004
  number: ADR-004
  title: Adopt Envoy for Store Locator
  date: 1744848000000
  status_timeline:
