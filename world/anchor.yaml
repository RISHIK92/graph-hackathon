decisions:
  - id: decision:adr-003
    number: ADR-003
    title: Run Ledger on Postgres Main
    status_timeline:
      - {status: accepted, at: "2025-01-06"}
      - {status: superseded, at: "2026-02-10"}
    deciders: [person:marta-kowalczyk, team:platform]
    affects: [system:ledger]
    replaces: []
    rationale_points:
      - Postgres Main is the shared relational store that Infra already operates with tested backups.
      - Ledger needs strict transactional guarantees for every double-entry posting.
    decision_text: Ledger keeps postings and balances in one dedicated schema with strict transactional guarantees.
    consequences: Infra runs backups and failover drills for the Ledger schema.
  - id: decision:adr-007
    number: ADR-007
    title: Move Ledger to Aurora
    status_timeline:
      - {status: proposed, at: "2026-01-20"}
      - {status: accepted, at: "2026-02-10"}
    deciders: [person:priya-raman, person:bob-lindqvist, team:payments]
    affects: [system:ledger]
    replaces: [decision:adr-003]
    rationale_points:
      - Postgres Main could not sustain Ledger write volume during month-end close.
      - Aurora gives Ledger storage autoscaling and replica failover in under a minute.
      - Moving Ledger off Postgres Main frees the shared cluster for Reporting workloads.
    decision_text: We will move Ledger from Postgres Main to Aurora once the cutover runbook has been rehearsed.
    consequences: Payments and Infra share the cutover runbook, and Reporting reads from the Aurora reader endpoint.

